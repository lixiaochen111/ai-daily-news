<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; font-src 'self' data:;">
  <title>AI 日报一键部署工具</title>

  <!-- Tailwind CSS 3.4 -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- DaisyUI 4.x -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />

  <!-- Custom styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-base-200 min-h-screen">
  <div class="container mx-auto p-4 max-w-4xl">
    <!-- Header -->
    <header class="mb-8">
      <h1 class="text-4xl font-bold text-center text-primary mb-2">AI 日报一键部署工具</h1>
      <p class="text-center text-base-content/70">一键将您的个性化新闻聚合器部署到 GitHub Pages</p>
    </header>

    <!-- Step Indicator -->
    <div class="mb-8">
      <ul class="steps steps-horizontal w-full">
        <li class="step step-primary" data-step="1">基本信息</li>
        <li class="step" data-step="2">GitHub 认证</li>
        <li class="step" data-step="3">RSS 订阅</li>
        <li class="step" data-step="4">高级选项</li>
        <li class="step" data-step="5">部署</li>
      </ul>
    </div>

    <!-- Main Content Area -->
    <div class="card bg-base-100 shadow-xl">
      <div class="card-body">
        <div id="step-content">
          <!-- Dynamic content will be loaded here -->
        </div>
      </div>
    </div>

    <!-- Footer Navigation -->
    <div class="flex justify-between mt-6">
      <button id="btn-back" class="btn btn-outline" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
        上一步
      </button>
      <button id="btn-next" class="btn btn-primary">
        下一步
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Step Templates (Hidden) -->

  <!-- Step 1: Basic Info -->
  <template id="step1-template">
    <h2 class="card-title text-2xl mb-4">第 1 步：基本信息</h2>
    <p class="text-base-content/70 mb-6">让我们从一些基本的部署信息开始。</p>

    <div class="form-control w-full mb-4">
      <label class="label">
        <span class="label-text">GitHub 用户名</span>
        <span class="label-text-alt text-error">*必填</span>
      </label>
      <input
        type="text"
        id="github-username"
        placeholder="你的用户名"
        class="input input-bordered w-full"
        required
      />
      <label class="label">
        <span class="label-text-alt">将在此用户名下创建仓库</span>
      </label>
    </div>

    <div class="form-control w-full mb-4">
      <label class="label">
        <span class="label-text">邮箱地址</span>
        <span class="label-text-alt text-error">*必填</span>
      </label>
      <input
        type="email"
        id="email"
        placeholder="your@example.com"
        class="input input-bordered w-full"
        required
      />
      <label class="label">
        <span class="label-text-alt">用于 Git 提交和通知</span>
      </label>
    </div>

    <div class="form-control w-full mb-4">
      <label class="label">
        <span class="label-text">仓库名称</span>
        <span class="label-text-alt text-error">*必填</span>
      </label>
      <input
        type="text"
        id="repo-name"
        placeholder="ai-daily-news"
        class="input input-bordered w-full"
        required
        pattern="[a-zA-Z0-9-_]+"
      />
      <label class="label">
        <span class="label-text-alt">只能包含字母、数字、连字符和下划线</span>
      </label>
    </div>

    <div class="divider my-6">AI 筛选配置（可选）</div>

    <div class="form-control w-full mb-4">
      <label class="label">
        <span class="label-text">智谱 AI API 密钥</span>
        <span class="label-text-alt">可选</span>
      </label>
      <div class="join w-full">
        <input
          type="password"
          id="glm-api-key"
          placeholder="输入智谱AI密钥"
          class="input input-bordered join-item flex-1 font-mono text-sm"
        />
        <button type="button" id="toggle-glm-key" class="btn btn-square join-item">
          <span id="eye-icon-glm">👁️</span>
        </button>
      </div>
      <label class="label">
        <span class="label-text-alt">用于免费GLM-4.7-Flash模型（初筛分类）</span>
      </label>
    </div>

    <div class="form-control w-full mb-4">
      <label class="label">
        <span class="label-text">EasyRouter API 密钥</span>
        <span class="label-text-alt">可选</span>
      </label>
      <div class="join w-full">
        <input
          type="password"
          id="easyrouter-api-key"
          placeholder="sk-xxxxxxxxxxxxxxxxxxxx"
          class="input input-bordered join-item flex-1 font-mono text-sm"
        />
        <button type="button" id="toggle-api-key-step1" class="btn btn-square join-item">
          <span id="eye-icon-step1">👁️</span>
        </button>
      </div>
      <label class="label">
        <span class="label-text-alt">用于DeepSeek/GPT-4o Mini（深度分析）</span>
      </label>
    </div>

    <div class="collapse collapse-arrow bg-base-200 mb-4">
      <input type="checkbox" />
      <div class="collapse-title font-medium text-sm">
        🤖 AI 筛选说明：为什么需要两个密钥？
      </div>
      <div class="collapse-content">
        <div class="space-y-3 text-sm">
          <div class="alert alert-info text-xs">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-current shrink-0 w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span>三层智能筛选：关键词过滤 → GLM免费初筛 → DeepSeek/GPT深度分析</span>
          </div>

          <div>
            <p class="font-semibold mb-2">1️⃣ 智谱AI（GLM-4.7-Flash）- 免费初筛</p>
            <ul class="list-disc list-inside space-y-1 ml-2 text-xs">
              <li>用途：快速分类，过滤明显无关内容</li>
              <li>获取：<a href="https://open.bigmodel.cn/" class="link link-primary" target="_blank">open.bigmodel.cn</a> 注册后获取API Key</li>
              <li>成本：<strong class="text-success">完全免费</strong>（每日有配额限制）</li>
            </ul>
          </div>

          <div>
            <p class="font-semibold mb-2">2️⃣ EasyRouter - 付费深度分析</p>
            <ul class="list-disc list-inside space-y-1 ml-2 text-xs">
              <li>用途：精准评分，选出高质量内容</li>
              <li>模型：DeepSeek（中文）+ GPT-4o Mini（英文）</li>
              <li>获取：<a href="https://easyrouter.ai/" class="link link-primary" target="_blank">easyrouter.ai</a> 注册后创建API密钥</li>
              <li>成本：约 <strong>¥0.08-0.25/天</strong></li>
            </ul>
          </div>

          <div class="alert alert-warning text-xs">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-current shrink-0 w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <div>
              <p class="font-medium">推荐配置</p>
              <p>两个密钥都配置：免费初筛 + 精准深度分析，性价比最高</p>
              <p>只配置EasyRouter：跳过初筛，成本稍高但更简单</p>
            </div>
          </div>

          <p class="text-xs text-base-content/60">
            💡 不需要AI筛选？留空两个字段，使用关键词筛选。部署后也可在仓库Settings → Secrets中添加。
          </p>
        </div>
      </div>
    </div>

    <div class="alert alert-info mt-6">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-current shrink-0 w-6 h-6">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <span>您的网站将发布在：<strong>https://<span class="username-preview">username</span>.github.io/<span class="repo-preview">repo-name</span></strong></span>
    </div>
  </template>

  <!-- Step 2: GitHub Authentication -->
  <template id="step2-template">
    <h2 class="card-title text-2xl mb-4">第 2 步：GitHub 认证</h2>
    <p class="text-base-content/70 mb-6">我们需要一个 GitHub 个人访问令牌来创建和配置您的仓库。</p>

    <div class="alert alert-warning mb-6">
      <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
      <div>
        <h3 class="font-bold">需要的令牌权限</h3>
        <p class="text-sm">您的令牌必须具有 <code class="bg-base-200 px-2 py-1 rounded">repo</code> 和 <code class="bg-base-200 px-2 py-1 rounded">workflow</code> 权限。</p>
      </div>
    </div>

    <div class="form-control w-full mb-4">
      <label class="label">
        <span class="label-text">GitHub 个人访问令牌</span>
        <span class="label-text-alt text-error">*必填</span>
      </label>
      <input
        type="password"
        id="github-token"
        placeholder="ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
        class="input input-bordered w-full font-mono"
        required
      />
      <label class="label">
        <span class="label-text-alt">经典令牌或具有适当权限的细粒度令牌</span>
      </label>
    </div>

    <div class="collapse collapse-arrow bg-base-200 mb-4">
      <input type="checkbox" />
      <div class="collapse-title font-medium">
        如何创建 GitHub 个人访问令牌
      </div>
      <div class="collapse-content">
        <ol class="list-decimal list-inside space-y-2 text-sm">
          <li>
            点击直达链接：<a href="https://github.com/settings/tokens/new" class="link link-primary" id="github-token-link" target="_blank">创建 GitHub Token</a>
            <br><span class="text-xs text-base-content/60">或手动前往：GitHub 设置 → Developer settings → Personal access tokens → Tokens (classic)</span>
          </li>
          <li>给它一个描述性的名称，如 "AI 日报部署工具"</li>
          <li>选择以下权限：
            <ul class="list-disc list-inside ml-6 mt-2">
              <li><code class="bg-base-300 px-1 rounded">repo</code> - 完全控制私有仓库</li>
              <li><code class="bg-base-300 px-1 rounded">workflow</code> - 更新 GitHub Action 工作流</li>
            </ul>
          </li>
          <li>点击 "Generate token" 并立即复制（您将无法再次看到它！）</li>
        </ol>
      </div>
    </div>

    <div class="form-control mb-4">
      <label class="label cursor-pointer justify-start gap-4">
        <input type="checkbox" id="save-token" class="checkbox checkbox-primary" />
        <span class="label-text">安全保存令牌以供将来使用</span>
      </label>
      <label class="label">
        <span class="label-text-alt">令牌将被加密并本地存储在您的计算机上</span>
      </label>
    </div>

    <button id="verify-token" class="btn btn-outline btn-sm">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      验证令牌
    </button>

    <div id="token-status" class="mt-4 hidden"></div>
  </template>

  <!-- Step 3: RSS 订阅源 -->
  <template id="step3-template">
    <h2 class="card-title text-2xl mb-4">第 3 步：RSS 订阅源配置</h2>
    <p class="text-base-content/70 mb-6">添加 RSS 订阅源，聚合您喜爱的新闻来源。</p>

    <div class="form-control w-full mb-4">
      <label class="label">
        <span class="label-text">订阅源 URL</span>
      </label>
      <div class="join w-full">
        <input
          type="url"
          id="feed-url"
          placeholder="https://example.com/feed.xml"
          class="input input-bordered join-item flex-1"
        />
        <button id="add-feed" class="btn btn-primary join-item">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          添加
        </button>
      </div>
      <label class="label">
        <span class="label-text-alt">输入有效的 RSS/Atom 订阅源 URL</span>
      </label>
    </div>

    <div class="divider">当前订阅源</div>

    <div id="feeds-list" class="space-y-2 mb-4">
      <!-- Feed items will be added here dynamically -->
      <div class="alert alert-info">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-current shrink-0 w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span>还未添加订阅源。请至少添加一个 RSS 订阅源以继续。</span>
      </div>
    </div>

    <div class="collapse collapse-arrow bg-base-200 mb-2">
      <input type="checkbox" />
      <div class="collapse-title font-medium">
        推荐的 AI 新闻源
      </div>
      <div class="collapse-content">
        <ul class="space-y-2">
          <li class="flex justify-between items-center">
            <span class="text-sm">TechCrunch AI</span>
            <button class="btn btn-xs btn-ghost suggested-feed" data-url="https://techcrunch.com/category/artificial-intelligence/feed/">添加</button>
          </li>
          <li class="flex justify-between items-center">
            <span class="text-sm">MIT Technology Review AI</span>
            <button class="btn btn-xs btn-ghost suggested-feed" data-url="https://www.technologyreview.com/topic/artificial-intelligence/feed">添加</button>
          </li>
          <li class="flex justify-between items-center">
            <span class="text-sm">VentureBeat AI</span>
            <button class="btn btn-xs btn-ghost suggested-feed" data-url="https://venturebeat.com/category/ai/feed/">添加</button>
          </li>
          <li class="flex justify-between items-center">
            <span class="text-sm">The Verge AI</span>
            <button class="btn btn-xs btn-ghost suggested-feed" data-url="https://www.theverge.com/rss/ai-artificial-intelligence/index.xml">添加</button>
          </li>
        </ul>
      </div>
    </div>

    <div class="collapse collapse-arrow bg-base-200">
      <input type="checkbox" />
      <div class="collapse-title font-medium">
        推荐的设计/开发博主 (X/Twitter)
      </div>
      <div class="collapse-content">
        <div class="alert alert-info text-xs mb-3">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-current shrink-0 w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <span>通过 RSSHub 订阅 X 博主推文（免费，可能偶尔不稳定）</span>
        </div>
        <ul class="space-y-2">
          <li class="flex justify-between items-center">
            <div class="flex-1">
              <span class="text-sm font-medium">Ryo Lu</span>
              <span class="text-xs text-base-content/60 ml-2">Cursor.ai 设计师</span>
            </div>
            <button class="btn btn-xs btn-ghost suggested-feed" data-url="https://rsshub.pseudoyu.com/twitter/user/ryolu">添加</button>
          </li>
          <li class="flex justify-between items-center">
            <div class="flex-1">
              <span class="text-sm font-medium">Gavin Nelson</span>
              <span class="text-xs text-base-content/60 ml-2">OpenAI 交互设计师</span>
            </div>
            <button class="btn btn-xs btn-ghost suggested-feed" data-url="https://rsshub.pseudoyu.com/twitter/user/Gavmn">添加</button>
          </li>
          <li class="flex justify-between items-center">
            <div class="flex-1">
              <span class="text-sm font-medium">归藏</span>
              <span class="text-xs text-base-content/60 ml-2">AIGC Weekly</span>
            </div>
            <button class="btn btn-xs btn-ghost suggested-feed" data-url="https://rsshub.pseudoyu.com/twitter/user/op7418">添加</button>
          </li>
          <li class="flex justify-between items-center">
            <div class="flex-1">
              <span class="text-sm font-medium">rauno</span>
              <span class="text-xs text-base-content/60 ml-2">Vercel 设计工程师</span>
            </div>
            <button class="btn btn-xs btn-ghost suggested-feed" data-url="https://rsshub.pseudoyu.com/twitter/user/raunofreiberg">添加</button>
          </li>
          <li class="flex justify-between items-center">
            <div class="flex-1">
              <span class="text-sm font-medium">Jakub Antalik</span>
              <span class="text-xs text-base-content/60 ml-2">Lead Product Designer</span>
            </div>
            <button class="btn btn-xs btn-ghost suggested-feed" data-url="https://rsshub.pseudoyu.com/twitter/user/Jakubantalik">添加</button>
          </li>
          <li class="flex justify-between items-center">
            <div class="flex-1">
              <span class="text-sm font-medium">Wojciech Zieliński</span>
              <span class="text-xs text-base-content/60 ml-2">Adobe 产品设计师</span>
            </div>
            <button class="btn btn-xs btn-ghost suggested-feed" data-url="https://rsshub.pseudoyu.com/twitter/user/zielinskiwoj">添加</button>
          </li>
          <li class="flex justify-between items-center">
            <div class="flex-1">
              <span class="text-sm font-medium">Matt Silva</span>
              <span class="text-xs text-base-content/60 ml-2">UI 工程师</span>
            </div>
            <button class="btn btn-xs btn-ghost suggested-feed" data-url="https://rsshub.pseudoyu.com/twitter/user/mattsilx">添加</button>
          </li>
          <li class="flex justify-between items-center">
            <div class="flex-1">
              <span class="text-sm font-medium">Eduard Bodak</span>
              <span class="text-xs text-base-content/60 ml-2">网站设计师</span>
            </div>
            <button class="btn btn-xs btn-ghost suggested-feed" data-url="https://rsshub.pseudoyu.com/twitter/user/eduardbodak">添加</button>
          </li>
          <li class="flex justify-between items-center">
            <div class="flex-1">
              <span class="text-sm font-medium">Enzo Mangano</span>
              <span class="text-xs text-base-content/60 ml-2">Base 设计工程师</span>
            </div>
            <button class="btn btn-xs btn-ghost suggested-feed" data-url="https://rsshub.pseudoyu.com/twitter/user/reactivve_">添加</button>
          </li>
          <li class="flex justify-between items-center">
            <div class="flex-1">
              <span class="text-sm font-medium">Gustav Ekerot</span>
              <span class="text-xs text-base-content/60 ml-2">Rox.ai 设计工程师</span>
            </div>
            <button class="btn btn-xs btn-ghost suggested-feed" data-url="https://rsshub.pseudoyu.com/twitter/user/designgurra">添加</button>
          </li>
          <li class="flex justify-between items-center">
            <div class="flex-1">
              <span class="text-sm font-medium">Berryxia.AI</span>
              <span class="text-xs text-base-content/60 ml-2">AI 工具开发者</span>
            </div>
            <button class="btn btn-xs btn-ghost suggested-feed" data-url="https://rsshub.pseudoyu.com/twitter/user/berryxia">添加</button>
          </li>
        </ul>
        <div class="divider text-xs">一键添加所有</div>
        <button id="add-all-design-feeds" class="btn btn-sm btn-outline btn-primary w-full">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          添加所有11个设计博主
        </button>
      </div>
    </div>
  </template>

  <!-- 第 4 步：高级选项 -->
  <template id="step4-template">
    <h2 class="card-title text-2xl mb-4">第 4 步：高级配置</h2>
    <p class="text-base-content/70 mb-6">自定义更新计划和其他设置。</p>

    <div class="form-control w-full mb-4">
      <label class="label">
        <span class="label-text">更新计划</span>
      </label>
      <select id="update-schedule" class="select select-bordered w-full">
        <option value="0 */6 * * *">每 6 小时</option>
        <option value="0 */12 * * *">每 12 小时</option>
        <option value="0 0 * * *" selected>每天午夜</option>
        <option value="0 0 * * 1">每周一次（周一）</option>
        <option value="custom">自定义 cron 表达式</option>
      </select>
      <label class="label">
        <span class="label-text-alt">GitHub Actions 抓取新文章的频率</span>
      </label>
    </div>

    <div id="custom-cron-container" class="form-control w-full mb-4 hidden">
      <label class="label">
        <span class="label-text">自定义 Cron 表达式</span>
      </label>
      <input
        type="text"
        id="custom-cron"
        placeholder="0 */6 * * *"
        class="input input-bordered w-full font-mono"
      />
      <label class="label">
        <span class="label-text-alt">
          使用 <a href="https://crontab.guru/" class="link link-primary" id="cron-help-link" target="_blank">crontab 格式</a>
          (分 时 日 月 星期)
        </span>
      </label>
    </div>

    <div class="form-control w-full mb-4">
      <label class="label">
        <span class="label-text">时区</span>
      </label>
      <select id="timezone" class="select select-bordered w-full">
        <option value="UTC">UTC (协调世界时)</option>
        <option value="America/New_York">东部时间 (ET)</option>
        <option value="America/Chicago">中部时间 (CT)</option>
        <option value="America/Denver">山地时间 (MT)</option>
        <option value="America/Los_Angeles">太平洋时间 (PT)</option>
        <option value="Europe/London">伦敦 (GMT/BST)</option>
        <option value="Europe/Paris">巴黎 (CET/CEST)</option>
        <option value="Asia/Tokyo">东京 (JST)</option>
        <option value="Asia/Shanghai">上海 (CST)</option>
        <option value="Australia/Sydney">悉尼 (AEDT/AEST)</option>
      </select>
      <label class="label">
        <span class="label-text-alt">计划更新的时区</span>
      </label>
    </div>

    <div class="form-control w-full mb-4">
      <label class="label">
        <span class="label-text">每页文章数</span>
      </label>
      <input
        type="number"
        id="articles-per-page"
        min="5"
        max="100"
        value="20"
        class="input input-bordered w-full"
      />
      <label class="label">
        <span class="label-text-alt">每页显示的文章数量 (5-100)</span>
      </label>
    </div>

    <div class="form-control mb-4">
      <label class="label cursor-pointer justify-start gap-4">
        <input type="checkbox" id="enable-comments" class="checkbox checkbox-primary" />
        <span class="label-text">启用 GitHub Discussions 评论功能</span>
      </label>
    </div>

    <div class="form-control mb-4">
      <label class="label cursor-pointer justify-start gap-4">
        <input type="checkbox" id="enable-analytics" class="checkbox checkbox-primary" />
        <span class="label-text">启用基础分析（隐私友好）</span>
      </label>
    </div>

    <div class="alert alert-info mt-6">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-current shrink-0 w-6 h-6">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <span>这些设置可以稍后通过修改仓库的配置文件来更改。</span>
    </div>
  </template>

  <!-- 第 5 步：审查和部署 -->
  <template id="step5-template">
    <h2 class="card-title text-2xl mb-4">第 5 步：审查和部署</h2>
    <p class="text-base-content/70 mb-6">检查您的配置并开始部署。</p>

    <!-- 配置摘要 -->
    <div id="config-summary" class="space-y-4 mb-6">
      <div class="card bg-base-200">
        <div class="card-body py-4">
          <h3 class="font-bold mb-2">基本信息</h3>
          <div class="grid grid-cols-2 gap-2 text-sm">
            <div class="text-base-content/70">GitHub 用户名:</div>
            <div class="font-mono" id="summary-username">-</div>
            <div class="text-base-content/70">邮箱:</div>
            <div class="font-mono" id="summary-email">-</div>
            <div class="text-base-content/70">仓库:</div>
            <div class="font-mono" id="summary-repo">-</div>
            <div class="text-base-content/70">AI 筛选:</div>
            <div id="summary-ai-filter">-</div>
          </div>
        </div>
      </div>

      <div class="card bg-base-200">
        <div class="card-body py-4">
          <h3 class="font-bold mb-2">RSS 订阅源</h3>
          <div id="summary-feeds" class="text-sm space-y-1">
            <!-- Feed list will be inserted here -->
          </div>
        </div>
      </div>

      <div class="card bg-base-200">
        <div class="card-body py-4">
          <h3 class="font-bold mb-2">高级设置</h3>
          <div class="grid grid-cols-2 gap-2 text-sm">
            <div class="text-base-content/70">更新计划:</div>
            <div id="summary-schedule">-</div>
            <div class="text-base-content/70">时区:</div>
            <div id="summary-timezone">-</div>
            <div class="text-base-content/70">每页文章数:</div>
            <div id="summary-articles">-</div>
            <div class="text-base-content/70">评论:</div>
            <div id="summary-comments">-</div>
            <div class="text-base-content/70">分析:</div>
            <div id="summary-analytics">-</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Deploy Button -->
    <div id="deploy-actions" class="flex flex-col gap-4">
      <button id="btn-deploy" class="btn btn-primary btn-lg w-full">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
        </svg>
        立即部署
      </button>

      <div class="text-center text-sm text-base-content/70">
        这将创建一个新仓库并配置 GitHub Actions
      </div>
    </div>

    <!-- Deployment Progress (Hidden by default) -->
    <div id="deploy-progress" class="hidden space-y-4">
      <div class="text-center mb-4">
        <span class="loading loading-spinner loading-lg text-primary"></span>
      </div>

      <ul class="steps steps-vertical">
        <li class="step" data-status="pending" id="progress-repo">
          <div class="text-left">正在创建仓库...</div>
        </li>
        <li class="step" data-status="pending" id="progress-files">
          <div class="text-left">正在上传文件...</div>
        </li>
        <li class="step" data-status="pending" id="progress-actions">
          <div class="text-left">正在配置 GitHub Actions...</div>
        </li>
        <li class="step" data-status="pending" id="progress-pages">
          <div class="text-left">正在启用 GitHub Pages...</div>
        </li>
        <li class="step" data-status="pending" id="progress-complete">
          <div class="text-left">正在完成部署...</div>
        </li>
      </ul>

      <div id="progress-log" class="mockup-code bg-neutral text-neutral-content text-xs max-h-60 overflow-y-auto">
        <pre data-prefix="$"><code>Starting deployment...</code></pre>
      </div>
    </div>

    <!-- Success State (Hidden by default) -->
    <div id="deploy-success" class="hidden">
      <div class="alert alert-success">
        <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <div>
          <h3 class="font-bold">部署成功！</h3>
          <div class="text-sm">您的 AI 日报网站现已上线。请等待 1-2 分钟让 GitHub Pages 完成首次构建。</div>
        </div>
      </div>

      <div class="card bg-base-200 mt-4">
        <div class="card-body">
          <h3 class="font-bold mb-4">下一步</h3>
          <div class="space-y-3">
            <div>
              <div class="text-sm text-base-content/70 mb-1">您的站点 URL:</div>
              <div class="flex gap-2">
                <input
                  type="text"
                  id="site-url"
                  readonly
                  class="input input-bordered input-sm flex-1 font-mono text-xs"
                  value="https://username.github.io/repo-name"
                />
                <button id="copy-url" class="btn btn-sm btn-square">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                  </svg>
                </button>
              </div>
            </div>

            <div>
              <div class="text-sm text-base-content/70 mb-1">仓库 URL:</div>
              <div class="flex gap-2">
                <input
                  type="text"
                  id="repo-url"
                  readonly
                  class="input input-bordered input-sm flex-1 font-mono text-xs"
                  value="https://github.com/username/repo-name"
                />
                <button id="copy-repo-url" class="btn btn-sm btn-square">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="divider"></div>

            <div class="alert alert-warning text-sm mb-3">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-current shrink-0 w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
              </svg>
              <div>
                <p class="font-medium">⏱️ GitHub Pages 首次部署需要时间</p>
                <p class="text-xs">如果网站无法打开，请等待 1-2 分钟后刷新。GitHub 正在构建和发布您的网站。</p>
              </div>
            </div>

            <div class="flex gap-2">
              <button id="open-site" class="btn btn-primary btn-sm flex-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                </svg>
                打开站点
              </button>
              <button id="open-repo" class="btn btn-outline btn-sm flex-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                </svg>
                打开仓库
              </button>
            </div>
          </div>
        </div>
      </div>

      <button id="btn-new-deployment" class="btn btn-outline w-full mt-4">
        创建另一个部署
      </button>
    </div>

    <!-- Error State (Hidden by default) -->
    <div id="deploy-error" class="hidden">
      <div class="alert alert-error">
        <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <div>
          <h3 class="font-bold">部署失败</h3>
          <div class="text-sm" id="error-message">部署过程中发生错误。</div>
        </div>
      </div>

      <div class="card bg-base-200 mt-4">
        <div class="card-body">
          <h3 class="font-bold mb-2">错误详情</h3>
          <pre class="text-xs bg-base-300 p-4 rounded overflow-x-auto" id="error-details">-</pre>
        </div>
      </div>

      <div class="flex gap-2 mt-4">
        <button id="btn-retry" class="btn btn-primary flex-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          重试部署
        </button>
        <button id="btn-back-to-config" class="btn btn-outline flex-1">
          返回配置
        </button>
      </div>
    </div>
  </template>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
